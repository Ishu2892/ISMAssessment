<!DOCTYPE html>

<head>

  <title>Submitted &middot; ISM DATA TECHNOLOGY ASSESSMENT</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
</head>
<body>

  <div class="center-screen">
    <div class="thanks">
      <div class="tick">&#10003;</div>
      <h2>Assessment submitted</h2>
      <p>Thank you for completing the ISM DATA TECHNOLOGY ASSESSMENT. Your responses have been recorded.</p>
    </div>
  </div>

  <script>
    // Keep the back button from re-entering the paper. The server refuses a
    // finished session anyway; this just avoids a confusing flash.
    (function () {
      'use strict';
      history.replaceState(null, '', '/thankyou');
      history.pushState(null, '', '/thankyou');
      window.addEventListener('popstate', function () {
        history.pushState(null, '', '/thankyou');
      });
    })();
  </script>
